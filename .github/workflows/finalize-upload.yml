name: Finalize Smart Calendar upload

on:
  push:
    paths:
      - '.github/workflows/finalize-upload.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode, verify, and install package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smart-calendar
          base64 --decode .upload/package.b64 > /tmp/Smart-Calendar-upload-ready.zip
          echo 'eeb69b405e5dc070e5c55c6af668a934b38cfd268776e46f6797bf03c1b72b29  /tmp/Smart-Calendar-upload-ready.zip' | sha256sum -c -
          unzip -q /tmp/Smart-Calendar-upload-ready.zip -d /tmp/smart-calendar
          cd /tmp/smart-calendar
          cat > /tmp/smart-calendar.sha256 <<'EOF'
          edcf3b00ec9d901ff89fb8e2c765dd76fb62779d4c41441cb439544a08280c9b  .gitignore
          d4e0a5f63b62a38c8e56e7ce0709431f54b9ff276ca62b6c113fa82b590172e7  README.md
          9db3cabc0342488e55258979c4e376f49584f9174e431c009385c8278ce4a137  apps-script/appsscript.json
          b6ba01635566758dbe728f2cdb7d2769ad9f3ab272979634c969966fad1a1bcc  apps-script/Untitled.gs
          92514c85d9e75bdc282618dd95f98ddebfd82344e13a79bac41040da4f523337  spreadsheet/Schedule-v2.70.xlsx
          EOF
          sha256sum -c /tmp/smart-calendar.sha256
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/smart-calendar/. .
          rm -rf .upload
          rm -f .github/workflows/finalize-upload.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit clean repository tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'feat: import Smart Calendar Schedule v2.70'
          git push origin HEAD:main
